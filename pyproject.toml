[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stringtree"
version = "0.1.0"
description = "Indented String Tree (IST) parser and serializer scaffolding"
readme = "README.md"
authors = [
  { name = "Stringtree Maintainers" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["IST", "serialization", "parser", "indentation"]
dependencies = []

[project.urls]
Homepage = "https://example.com/stringtree"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
pythonpath = ["src"]
